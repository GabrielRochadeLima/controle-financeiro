<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Financeiro</title>
  <!-- CSP: só código do próprio site; conexões apenas com o Supabase. 'unsafe-inline' só em style
       (o app usa style="" para larguras e cores). frame-ancestors não funciona em <meta>; ver README. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="app-main" id="outlet" tabindex="-1">
      <div class="page" aria-busy="true">
        <div class="skeleton skeleton-line" style="width:40%"></div>
        <div class="skeleton skeleton-block"></div>
        <div class="skeleton skeleton-block"></div>
      </div>
    </main>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Principal"></nav>
  </div>

  <div class="app-main" id="setup-notice" hidden>
    <div class="page">
      <h1>Configuração necessária</h1>
      <div class="card">
        <p>Abra <code>js/config.js</code> e preencha <code>SUPABASE_URL</code> e
        <code>SUPABASE_ANON_KEY</code> com os dados do seu projeto Supabase
        (Project Settings &rarr; API). Detalhes no README.</p>
      </div>
    </div>
  </div>

  <noscript>Este aplicativo precisa de JavaScript para funcionar.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
